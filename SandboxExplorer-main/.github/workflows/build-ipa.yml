name: Build SandboxExplorer IPA

# macOS 26 runners ship Xcode 26.6 + iOS 26.5 SDK. GitHub also offers the
# `xcode-27` label (macOS 26 arm64 + Xcode 27) if you want the newer toolchain;
# this project builds on either. If your account does not offer macos-26,
# change runs-on to the newest macOS label that has an iOS 26 SDK.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle ID (must match your provisioning profile)'
        required: false
        default: 'dev.local.SandboxExplorer'
      app_group:
        description: 'App Group ID (must be in the provisioning profile)'
        required: false
        default: 'group.dev.local.SandboxExplorer'
      display_name:
        description: 'App display name'
        required: false
        default: '沙盒管家'
      sign_mode:
        description: 'adhoc = embed App Group entitlements in the build (no cert); signed = installable IPA via secrets; unsigned = re-sign locally'
        required: true
        default: 'adhoc'
        type: choice
        options:
          - adhoc
          - unsigned
          - signed
      xcode_path:
        description: 'Optional absolute Xcode path, e.g. /Applications/Xcode_27.2.app'
        required: false
        default: ''

permissions:
  # write is only used by the failure-log fallback, which pushes the build log
  # to the orphan `ci-logs` branch so it can be read without a PAT.
  contents: write

jobs:
  build-ipa:
    name: Build .ipa on macOS
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static project validation
        run: python3 Scripts/verify_project.py

      - name: Select Xcode and show SDKs
        run: |
          set -euo pipefail
          XCODE_PATH="${{ inputs.xcode_path }}"
          if [[ -n "$XCODE_PATH" ]]; then
            echo "Selecting $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          else
            echo "Using runner default: $(xcode-select -p)"
          fi
          xcodebuild -version
          SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iphoneos SDK = $SDK"
          if [[ "${SDK%%.*}" -lt 26 ]]; then
            echo "::warning::This image has iOS SDK $SDK. The project still compiles, but container access needs iOS 26+ at runtime."
          fi
          xcodebuild -showsdks | grep -E 'iOS|iphoneos' || true

      - name: Configure bundle ID / App Group / display name
        run: |
          bash Scripts/configure.sh \
            --bundle-id    "${{ inputs.bundle_id || 'dev.local.SandboxExplorer' }}" \
            --app-group    "${{ inputs.app_group || 'group.dev.local.SandboxExplorer' }}" \
            --display-name "${{ inputs.display_name || 'SandboxExplorer' }}"
          echo "--- entitlements ---"
          cat Config/SandboxExplorer.entitlements

      - name: Build and package IPA
        env:
          SIGN_MODE: ${{ inputs.sign_mode || 'adhoc' }}
          BUNDLE_ID: ${{ inputs.bundle_id || 'dev.local.SandboxExplorer' }}
          APP_GROUP_ID: ${{ inputs.app_group || 'group.dev.local.SandboxExplorer' }}
          DISPLAY_NAME: ${{ inputs.display_name || 'SandboxExplorer' }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: bash Scripts/build_ipa.sh

      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/dist/xcodebuild.log"
          [[ -f "$LOG" ]] || exit 0
          TMP="$(mktemp -d)"
          cd "$TMP"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tail -n 5000 "$LOG" > xcodebuild.log
          git add xcodebuild.log
          git commit -q -m "CI log: run ${{ github.run_number }} / ${{ github.sha }}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -q -f origin HEAD:refs/heads/ci-logs
          echo "build log published to branch ci-logs"

      - name: Upload IPA, entitlements and build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SandboxExplorer-IPA-${{ github.run_number }}
          path: |
            dist/SandboxExplorer-*.ipa
            dist/SandboxExplorer.entitlements.plist
            dist/SandboxExplorer.embedded-entitlements.plist
            dist/build-report.txt
            dist/xcodebuild.log
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        if: success()
        run: |
          {
            echo "### SandboxExplorer IPA"
            echo ""
            cat dist/build-report.txt | sed 's/^/    /'
            echo ""
            echo "Download the artifact \`SandboxExplorer-IPA-${{ github.run_number }}\`."
            echo ""
            echo "| sign_mode | what you get |"
            echo "|---|---|"
            echo "| adhoc | entitlements ALREADY inside the binary (ad-hoc signature) + a clean unsigned IPA |"
            echo "| signed | directly installable IPA, no re-sign needed |"
            echo "| unsigned | re-sign locally, feed Sideloadly the entitlements plist |"
            echo ""
            echo "\`SandboxExplorer.embedded-entitlements.plist\` is the exact plist codesign wrote."
          } >> "$GITHUB_STEP_SUMMARY"
