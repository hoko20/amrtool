name: AMRConverter
options:
  bundleIdPrefix: com.trae
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  AMRConverter:
    type: application
    platform: iOS
    sources:
      - path: AMRConverter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trae.amrconverter
        PRODUCT_NAME: AMRConverter
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: $(SRCROOT)/Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/AMRConverter/AMRBridge.h
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/include
          - $(SRCROOT)/Vendor/include/silk
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/lib
        OTHER_LDFLAGS:
          - "-lopencore-amrnb"
          - "-lvo-amrwbenc"
          - "-lSKP_SILK_SDK"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: PhotosUI.framework
      - sdk: UIKit.framework

schemes:
  AMRConverter:
    build:
      targets:
        AMRConverter: all
    run:
      config: Debug
    archive:
      config: Release
